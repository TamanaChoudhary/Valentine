<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Kiss Day 😄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffe5ec, #fff0f5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 10px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      transition: all 0.3s ease;
    }
    h1 { color: #ff4d6d; margin-bottom: 15px; }
    p { font-size: 18px; margin: 15px 0; line-height: 1.5; }
    img {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    button {
      border: none;
      padding: 12px 20px;
      margin-top: 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      background: #ff4d6d;
      color: white;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #ff1f4b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Lets skip this not our day</h1>
  <p>
  </p>
  <!-- Optional funny meme image for friends -->
  <img src="meme.jpeg" alt="Funny Friend Kiss Meme">
  <button onclick="goToNext()">Click here to move to Valentine’s Day 🎉</button>
</div>

<script>
function goToNext() {
  window.location.href = "valentine-day.html"; // Replace with your next page
}
</script>

</body>
</html>
