<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Hug Day 🤗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe5ec);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 10px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      transition: all 0.3s ease;
    }
    h1 { color: #ff4d6d; margin-bottom: 15px; }
    p { font-size: 18px; margin: 15px 0; line-height: 1.5; }
    button {
      border: none;
      padding: 12px 20px;
      margin-top: 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      background: #ff4d6d;
      color: white;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #ff1f4b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🤗 Happy Hug Day! 🤗</h1>
  <p>
    Today I promise to give you hugs —  
    whether you want them or not! 😄  
    Warning: Hugs may cause sudden happiness, uncontrollable smiles, and random giggles.  
    Handle with care! 💖
  </p>
  <button onclick="goToNext()">Click here to a day that I would love to skip</button>
</div>

<script>
function goToNext() {
  window.location.href = "kiss-day.html"; // Replace with your Kiss Day page
}
</script>

</body>
</html>
