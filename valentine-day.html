<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine's Day 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffe5ec, #fff0f5);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    max-width: 700px;
    width: 100%;
    text-align: center;
  }
  h1 {
    color: #ff4d6d;
    margin-bottom: 20px;
  }
  p {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  iframe {
    width: 100%;
    height: 600px;
    border: none;
    border-radius: 15px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>💖 Lo Ji Aa Gaya Vo Din 💖</h1>
  <p>
    Today is your chance to make my Valentine’s Day extra special!  
    Please leave a long, heartfelt message about how you feel.  
    Don’t worry — it’s completely anonymous, and I will read every single word. 💌
  </p>
  
  <!-- Embed your Google Form -->
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf68_q45k4m8_sZwgt9TrhryCUJcbl1eL7HagwM7TAhDVfPDQ/viewform?usp=publish-editor"></iframe>
</div>

</body>
</html>
